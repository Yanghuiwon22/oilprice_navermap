version: '3'

services:
  api:
    build: .
    container_name: oilprice_navermap_waitress
    ports:
      - "80:80"
    volumes:
      - ./:/usr/src/app

    command: python -m waitress --host=0.0.0.0 --port=80 --threads=2 main_waitress:app
    shm_size: "2gb"   # ⭐ selenium 필수

